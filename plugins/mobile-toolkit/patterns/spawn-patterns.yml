# Mobile Toolkit Spawn Patterns
# Usage: Reference with /spawn --pattern <pattern_name> "<task>"

Mobile_Patterns:

  # Cross-platform development: iOS + Android + Flutter in parallel
  mobile_cross_platform:
    description: "Parallel development across all mobile platforms"
    orchestrator:
      agent: ios-developer
      model: opus
    workers:
      - {agent: android-developer, model: opus, task: "Android implementation"}
      - {agent: flutter-expert, model: sonnet, task: "Flutter cross-platform"}
    aggregation: "iOS developer reviews consistency across platforms"
    example: "/spawn --pattern mobile_cross_platform 'Payment screen UI'"

  # iOS feature cycle: implement → review → PR
  ios_feature_cycle:
    description: "Full iOS feature development with quality review"
    sequence:
      - {phase: implement, agent: ios-developer, model: opus}
      - {phase: review, agent: swift-expert, model: opus, task: "Code quality review"}
      - {phase: summary, command: pr-summary}
    example: "/spawn --pattern ios_feature_cycle 'Add user authentication'"

  # Android feature cycle
  android_feature_cycle:
    description: "Full Android feature development cycle"
    sequence:
      - {phase: implement, agent: android-developer, model: opus}
      - {phase: review, agent: code-reviewer, model: opus}
      - {phase: summary, command: pr-summary}
    example: "/spawn --pattern android_feature_cycle 'Implement settings screen'"

  # Build pipeline: build → parse → optimize
  build_pipeline:
    description: "Build with xcsift parsing and TOON optimization"
    sequence:
      - {phase: build, skill: xcode-builder}
      - {phase: parse, skill: xcsift, task: "Parse build output"}
      - {phase: optimize, skill: to-toon, task: "Convert to TOON format"}
    example: "/spawn --pattern build_pipeline 'Build and analyze'"

  # Swift code quality review
  swift_quality_review:
    description: "Comprehensive Swift code review"
    orchestrator:
      agent: swift-expert
      model: opus
    workers:
      - {agent: ios-developer, model: opus, task: "iOS patterns compliance"}
    mcp: sequential-thinking
    example: "/spawn --pattern swift_quality_review 'Review networking layer'"

  # Flutter + native bridges
  flutter_native_integration:
    description: "Flutter with iOS and Android native integration"
    orchestrator:
      agent: flutter-expert
      model: sonnet
    workers:
      - {agent: ios-developer, model: opus, task: "Swift platform channel"}
      - {agent: android-developer, model: opus, task: "Kotlin platform channel"}
    example: "/spawn --pattern flutter_native_integration 'Add biometric auth'"

  # Simultaneous iOS and Android implementation
  dual_platform:
    description: "Same feature on iOS and Android simultaneously"
    workers:
      - {agent: ios-developer, model: opus, task: "iOS implementation"}
      - {agent: android-developer, model: opus, task: "Android implementation"}
    aggregation: "Compare implementations for consistency"
    example: "/spawn --pattern dual_platform 'Add push notifications'"

# Model Selection Guidelines for Mobile
Model_Guidelines:
  opus:
    - iOS-specific architecture decisions
    - Android Jetpack integration
    - Swift concurrency and performance
    - Security-critical code
    - Code review (final approval)

  sonnet:
    - Flutter cross-platform features
    - Standard UI implementation
    - Testing
    - Build configuration

  haiku:
    - Documentation generation
    - Simple refactoring
    - File operations

# MCP Routing for Mobile
mcp_routing:
  swift_docs:
    primary: context7
    library: "/apple/swift-docc"

  android_docs:
    primary: context7
    library: "/android/documentation"

  flutter_docs:
    primary: context7
    library: "/flutter/flutter"

  architecture_decisions:
    primary: sequential-thinking
